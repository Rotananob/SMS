<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Management System</title>
  <meta name="description" content="A modern student management system for academic institutions." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>

<body>

  <!-- ── Login Screen ─────────────────────────────────────────── -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <i class="fas fa-graduation-cap"></i>
      </div>
      <h1 class="login-title">Student Management System</h1>
      <p class="login-sub">Sign in to your account</p>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-icon">
            <i class="fas fa-user"></i>
            <input type="text" id="username" placeholder="Enter username" required />
          </div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-icon">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Enter password" required />
          </div>
        </div>
        <div id="login-error" class="alert alert-danger hidden"></div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">
          <span>Sign In</span>
          <i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <p class="login-hint">Default: <strong>admin</strong> / <strong>admin123</strong></p>
    </div>
  </div>

  <!-- ── Main App Shell ────────────────────────────────────────── -->
  <div id="app" class="app hidden">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <i class="fas fa-graduation-cap sidebar-logo-icon"></i>
        <span class="sidebar-title">SMS</span>
        <button class="sidebar-close" id="sidebar-close"><i class="fas fa-times"></i></button>
      </div>

      <nav class="sidebar-nav">
        <ul id="nav-links">
          <li><a href="#" data-page="dashboard" class="nav-link active"><i
                class="fas fa-home"></i><span>Dashboard</span></a></li>
          <li><a href="#" data-page="students" class="nav-link"><i
                class="fas fa-user-graduate"></i><span>Students</span></a></li>
          <li><a href="#" data-page="courses" class="nav-link"><i class="fas fa-book"></i><span>Courses</span></a></li>
          <li><a href="#" data-page="attendance" class="nav-link"><i
                class="fas fa-calendar-check"></i><span>Attendance</span></a></li>
          <li><a href="#" data-page="grades" class="nav-link"><i class="fas fa-star"></i><span>Grades</span></a></li>
          <li><a href="#" data-page="reports" class="nav-link"><i class="fas fa-chart-bar"></i><span>Reports</span></a>
          </li>
          <li><a href="#" data-page="notifications" class="nav-link"><i
                class="fas fa-bell"></i><span>Notifications</span></a></li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <div class="user-info" id="user-info"></div>
        <button class="btn-logout" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
      <header class="topbar">
        <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
        <div class="topbar-title" id="topbar-title">Dashboard</div>
        <div class="topbar-actions">
          <button class="topbar-icon-btn" id="notif-btn">
            <i class="fas fa-bell"></i>
            <span class="badge" id="notif-badge" style="display:none">0</span>
          </button>
          <div class="avatar" id="topbar-avatar"></div>
        </div>
      </header>

      <main class="main-content" id="main-content">
        <!-- Pages are injected here by app.js -->
        <div class="page-loader" id="page-loader">
          <div class="spinner"></div>
        </div>
      </main>
    </div>

  </div>

  <!-- ── Modal ─────────────────────────────────────────────────── -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button class="modal-close" id="modal-close"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <!-- ── Toast ─────────────────────────────────────────────────── -->
  <div id="toast-container"></div>

  <!-- App Scripts -->
  <script src="/static/js/api.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/dashboard.js"></script>
  <script src="/static/js/students.js"></script>
  <script src="/static/js/courses.js"></script>
  <script src="/static/js/attendance.js"></script>
  <script src="/static/js/grades.js"></script>
  <script src="/static/js/reports.js"></script>
  <script src="/static/js/notifications.js"></script>
</body>

</html>
